<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports – Manics Group</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="layout">
  <div id="sidebar-container"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn-icon" id="menu-toggle">☰</button>
        <h1 id="page-title">Reports</h1>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="dark-toggle">🌙</button>
        <button class="btn btn-accent btn-sm" onclick="exportCSV()">⬇ Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="printReport()">🖨 Print</button>
      </div>
    </div>
    <div class="content" id="report-content">
      <!-- Summary Stats -->
      <div class="stats-grid" id="report-stats"></div>

      <div class="dash-grid">
        <!-- Deal Status Chart -->
        <div>
          <div class="card" style="margin-bottom:20px;">
            <div class="card-header"><h3>📊 Deal Status Breakdown</h3></div>
            <div class="card-body">
              <div id="deal-status-chart"></div>
            </div>
          </div>

          <!-- Partner Performance -->
          <div class="card">
            <div class="card-header"><h3>🏆 Partner Performance</h3></div>
            <div class="card-body" style="padding:0;">
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Partner</th><th>Deals</th><th>Total Value (RWF)</th><th>ZAR Equiv.</th><th>Status</th></tr></thead>
                  <tbody id="partner-perf-table"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

        <div>
          <!-- Contract Status -->
          <div class="card" style="margin-bottom:20px;">
            <div class="card-header"><h3>📄 Contract Status</h3></div>
            <div class="card-body" id="contract-status-chart"></div>
          </div>

          <!-- Recent Reports Log -->
          <div class="card">
            <div class="card-header">
              <h3>📋 Report History</h3>
              <button class="btn btn-sm btn-primary" onclick="generateReport()">Generate Report</button>
            </div>
            <div class="card-body" style="padding:0;">
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Report Name</th><th>Generated By</th><th>Date</th></tr></thead>
                  <tbody id="reports-log"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Deals Table -->
      <div class="card" style="margin-top:20px;">
        <div class="card-header"><h3>💼 All Deals Summary</h3></div>
        <div class="card-body" style="padding:0;">
          <div class="table-wrap">
            <table id="deals-summary-table">
              <thead><tr><th>#</th><th>Deal Name</th><th>Partner</th><th>Amount (RWF)</th><th>ZAR Equiv.</th><th>Status</th><th>Start</th><th>End</th></tr></thead>
              <tbody id="deals-summary-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="assets/app.js"></script>
<script src="assets/sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  requireAuth();
  renderSidebar('Reports');
  renderAll();
});

function renderAll() {
  const partners = DB.get('partners');
  const deals = DB.get('deals');
  const contracts = DB.get('contracts');
  const comms = DB.get('communications');

  const totalRevenue = deals.filter(d => d.status === 'Completed').reduce((s,d) => s + d.amount, 0);
  const activeDeals = deals.filter(d => ['New','Negotiation','Approved'].includes(d.status));
  const expiredContracts = contracts.filter(c => c.status === 'Expired');

  // Stats
  document.getElementById('report-stats').innerHTML = [
    { label: 'Total Partners', value: partners.length, icon: '🤝', color: 'blue' },
    { label: 'Total Deals', value: deals.length, icon: '💼', color: 'green' },
    { label: 'Active Deals', value: activeDeals.length, icon: '🔥', color: 'orange' },
    { label: 'Completed Deals', value: deals.filter(d=>d.status==='Completed').length, icon: '✅', color: 'teal' },
    { label: 'Expired Contracts', value: expiredContracts.length, icon: '⚠️', color: 'red' },
    { label: 'Total Revenue (RWF)', value: fmtRWF(totalRevenue), icon: '💰', color: 'purple' }
  ].map(s => `<div class="stat-card"><div class="stat-icon ${s.color}">${s.icon}</div>
    <div class="stat-info"><h4>${s.value}</h4><p>${s.label}</p></div></div>`).join('');

  // Deal status chart (horizontal bars)
  const statuses = ['New','Negotiation','Approved','Completed','Rejected'];
  const colors = { New:'#3182ce', Negotiation:'#d69e2e', Approved:'#38a169', Completed:'#1a3c5e', Rejected:'#e53e3e' };
  const total = deals.length || 1;
  document.getElementById('deal-status-chart').innerHTML = statuses.map(s => {
    const c = deals.filter(d => d.status === s).length;
    const pct = Math.round(c/total*100);
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:4px;">
        <span>${s}</span><span>${c} (${pct}%)</span>
      </div>
      <div class="progress"><div class="progress-bar" style="width:${pct}%;background:${colors[s]};"></div></div>
    </div>`;
  }).join('');

  // Contract status donut-like
  const cStatuses = ['Active','Expired','Pending','Renewed'];
  const cColors = { Active:'#38a169', Expired:'#e53e3e', Pending:'#d69e2e', Renewed:'#3182ce' };
  document.getElementById('contract-status-chart').innerHTML = cStatuses.map(s => {
    const c = contracts.filter(x => x.status === s).length;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:0.84rem;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:12px;height:12px;border-radius:50%;background:${cColors[s]};"></div>
        <span>${s}</span>
      </div>
      <strong>${c}</strong>
    </div>`;
  }).join('');

  // Partner performance
  document.getElementById('partner-perf-table').innerHTML = partners.map(p => {
    const pDeals = deals.filter(d => d.partner_id === p.id);
    const val = pDeals.reduce((s,d) => s + d.amount, 0);
    return `<tr>
      <td><strong>${p.company_name}</strong></td>
      <td>${pDeals.length}</td>
      <td>${fmtRWF(val)}</td>
      <td style="color:var(--muted);font-size:0.82rem;">${fmtZAR(val)}</td>
      <td><span class="badge ${p.status==='Active'?'badge-success':'badge-muted'}">${p.status}</span></td>
    </tr>`;
  }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted);">No data</td></tr>';

  // Deals summary
  document.getElementById('deals-summary-body').innerHTML = deals.map((d,i) => {
    const p = partners.find(x => x.id === d.partner_id);
    const sc = { New:'badge-info', Negotiation:'badge-warning', Approved:'badge-success', Completed:'badge-primary', Rejected:'badge-danger' };
    return `<tr>
      <td>${i+1}</td><td>${d.deal_name}</td><td>${p?.company_name||'—'}</td>
      <td>${fmtRWF(d.amount)}</td>
      <td style="color:var(--muted);font-size:0.82rem;">${fmtZAR(d.amount)}</td>
      <td><span class="badge ${sc[d.status]||''}">${d.status}</span></td>
      <td>${fmtDate(d.start_date)}</td><td>${fmtDate(d.end_date)}</td>
    </tr>`;
  }).join('');

  // Reports log
  const reports = DB.get('reports');
  document.getElementById('reports-log').innerHTML = reports.length
    ? reports.slice(0,8).map(r => `<tr><td>${r.report_name}</td><td>${r.generated_by}</td><td>${fmtDate(r.generated_date)}</td></tr>`).join('')
    : '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:16px;">No reports generated yet.</td></tr>';
}

function generateReport() {
  const u = getCurrentUser();
  const reports = DB.get('reports');
  const name = `Monthly Summary – ${new Date().toLocaleDateString('en-ZA', {month:'long', year:'numeric'})}`;
  reports.unshift({ id: nextId(reports), report_name: name, generated_by: u?.fullname || 'System', generated_date: new Date().toISOString().split('T')[0] });
  DB.set('reports', reports);
  logActivity(`Report "${name}" generated`, '📊');
  toast('Report generated!');
  renderAll();
}

function exportCSV() {
  const deals = DB.get('deals');
  const partners = DB.get('partners');
  const rows = [['Deal Name','Partner','Amount (RWF)','Amount (ZAR)','Status','Start Date','End Date']];
  deals.forEach(d => {
    const p = partners.find(x => x.id === d.partner_id);
    rows.push([d.deal_name, p?.company_name||'', d.amount, toZAR(d.amount), d.status, d.start_date||'', d.end_date||'']);
  });
  const csv = rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `manics_deals_report_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  toast('CSV exported!');
}

function printReport() {
  window.print();
}
</script>
</body>
</html>
