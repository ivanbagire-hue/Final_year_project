<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Manics Ltd Partnership System</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div style="width:70px;height:70px;background:linear-gradient(135deg,#1a3c5e,#2d6a9f);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:1.8rem;">🍞</div>
      <h2>Manics Ltd</h2>
      <p>Business Partnership Management Information System</p>
    </div>
    <h3>Sign In</h3>
    <div id="login-error" class="alert alert-danger" style="display:none;"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="you@manicsgroup.co.za" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required />
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;font-size:0.82rem;">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="remember" /> Remember me
        </label>
        <span title="Contact an administrator to reset your password" style="color:var(--muted);">Password help: administrator</span>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:0.78rem;color:var(--muted);">
      Demo administrator: admin@manicsgroup.co.za / admin123
    </p>
    <p style="text-align:center;margin-top:8px;font-size:0.75rem;color:var(--muted);">
      © 2026 Manics Ltd · Your Taste, Our Passion!
    </p>
  </div>

  <script src="assets/app.js"></script>
  <script>
    document.addEventListener('appready', () => {
      if (getCurrentUser()) window.location.href = 'dashboard.html';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const button = e.currentTarget.querySelector('button[type="submit"]');
      button.disabled = true;
      button.textContent = 'Signing in…';
      try {
        await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password: pass, remember: document.getElementById('remember').checked })
        });
        window.location.href = 'dashboard.html';
      } catch (error) {
        const err = document.getElementById('login-error');
        err.textContent = error.message;
        err.style.display = 'block';
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
