<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile – Manics Ltd</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="layout">
  <div id="sidebar-container"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn-icon" id="menu-toggle">☰</button>
        <h1 id="page-title">Profile & Settings</h1>
      </div>
      <div class="topbar-right">
        <button class="btn-icon" id="dark-toggle">🌙</button>
      </div>
    </div>
    <div class="content">
      <!-- Profile Header -->
      <div class="profile-header" id="profile-header"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;" class="form-row">
        <!-- Edit Profile -->
        <div class="card">
          <div class="card-header"><h3>✏️ Edit Profile</h3></div>
          <div class="card-body">
            <div id="profile-alert"></div>
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" class="form-control" id="prof-name" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" class="form-control" id="prof-email" />
            </div>
            <div class="form-group">
              <label>Role</label>
              <input type="text" class="form-control" id="prof-role" disabled style="background:var(--bg);" />
            </div>
            <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
          </div>
        </div>

        <!-- Change Password -->
        <div class="card">
          <div class="card-header"><h3>🔑 Change Password</h3></div>
          <div class="card-body">
            <div id="pwd-alert"></div>
            <div class="form-group">
              <label>Current Password</label>
              <input type="password" class="form-control" id="pwd-current" />
            </div>
            <div class="form-group">
              <label>New Password</label>
              <input type="password" class="form-control" id="pwd-new" />
            </div>
            <div class="form-group">
              <label>Confirm New Password</label>
              <input type="password" class="form-control" id="pwd-confirm" />
            </div>
            <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
          </div>
        </div>
      </div>

      <!-- Settings -->
      <div class="card" style="margin-top:20px;">
        <div class="card-header"><h3>⚙️ System Settings</h3></div>
        <div class="card-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;">
            <div>
              <h4 style="font-size:0.9rem;margin-bottom:12px;">Appearance</h4>
              <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
                <span style="font-size:0.85rem;">Dark Mode</span>
                <label style="position:relative;display:inline-block;width:44px;height:24px;">
                  <input type="checkbox" id="dark-toggle-settings" style="opacity:0;width:0;height:0;" />
                  <span style="position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.3s;" id="toggle-track"></span>
                </label>
              </div>
            </div>
            <div>
              <h4 style="font-size:0.9rem;margin-bottom:12px;">Data Management</h4>
              <button class="btn btn-outline btn-sm" onclick="exportAllData()" style="margin-bottom:8px;width:100%;">
                📤 Export All Data (JSON)
              </button>
              <button class="btn btn-danger btn-sm" id="reset-data-button" onclick="clearData()" style="width:100%;">
                🗑 Reset All Data
              </button>
            </div>
            <div>
              <h4 style="font-size:0.9rem;margin-bottom:12px;">About System</h4>
              <div style="font-size:0.82rem;color:var(--muted);line-height:1.8;">
                <div><strong>System:</strong> Business Partnership </div>
                <div><strong>Company:</strong> Manics Ltd</div>
                <div><strong>Version:</strong> 1.0.0</div>
                <div><strong>Motto:</strong> Your Taste, Our Passion!</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Activity Log -->
      <div class="card" style="margin-top:20px;">
        <div class="card-header"><h3>📋 Activity Log</h3></div>
        <div class="card-body" style="padding:0;">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Activity</th><th>Time</th></tr></thead>
              <tbody id="activity-log"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="assets/app.js"></script>
<script src="assets/sidebar.js"></script>
<script>
document.addEventListener('appready', () => {
  requireAuth();
  renderSidebar('Profile & Settings');
  if (getCurrentUser()?.role !== 'Administrator') document.getElementById('reset-data-button').style.display = 'none';
  loadProfile();
  loadActivityLog();
  initSettingsToggle();
});

function loadProfile() {
  const u = getCurrentUser();
  if (!u) return;
  document.getElementById('profile-header').innerHTML = `
    <div class="profile-avatar">${u.fullname.charAt(0)}</div>
    <div class="profile-info">
      <h2>${u.fullname}</h2>
      <p>${u.role} · ${u.email}</p>
      <p style="margin-top:4px;font-size:0.78rem;opacity:0.7;">Member since ${fmtDate(u.created_at)}</p>
    </div>`;
  document.getElementById('prof-name').value = u.fullname;
  document.getElementById('prof-email').value = u.email;
  document.getElementById('prof-role').value = u.role;
}

async function saveProfile() {
  const name = document.getElementById('prof-name').value.trim();
  const email = document.getElementById('prof-email').value.trim();
  if (!name || !email) { showAlert('profile-alert', 'Name and email are required.', 'danger'); return; }

  try {
    const result = await apiFetch('/api/profile', {
      method: 'PUT',
      body: JSON.stringify({ fullname: name, email })
    });
    DB.setObj('current_user', result.user);
    const users = DB.get('users');
    const idx = users.findIndex(x => x.id === result.user.id);
    if (idx >= 0) users[idx] = result.user;
    DB.setLocal('users', users);
  } catch (error) {
    showAlert('profile-alert', error.message, 'danger');
    return;
  }
  renderSidebarUser();
  loadProfile();
  showAlert('profile-alert', 'Profile updated successfully!', 'success');
  toast('Profile saved!');
}

async function changePassword() {
  const current = document.getElementById('pwd-current').value;
  const np = document.getElementById('pwd-new').value;
  const cp = document.getElementById('pwd-confirm').value;
  if (np.length < 8) { showAlert('pwd-alert', 'New password must be at least 8 characters.', 'danger'); return; }
  if (np !== cp) { showAlert('pwd-alert', 'Passwords do not match.', 'danger'); return; }
  try {
    await apiFetch('/api/profile/password', {
      method: 'PUT',
      body: JSON.stringify({ current_password: current, new_password: np })
    });
  } catch (error) {
    showAlert('pwd-alert', error.message, 'danger');
    return;
  }
  document.getElementById('pwd-current').value = '';
  document.getElementById('pwd-new').value = '';
  document.getElementById('pwd-confirm').value = '';
  showAlert('pwd-alert', 'Password changed successfully!', 'success');
  toast('Password updated!');
}

function showAlert(id, msg, type) {
  const el = document.getElementById(id);
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}

function loadActivityLog() {
  const acts = DB.get('activities');
  document.getElementById('activity-log').innerHTML = acts.slice(0,15).map(a =>
    `<tr><td>${a.icon} ${a.text}</td><td style="color:var(--muted);font-size:0.8rem;">${a.time}</td></tr>`
  ).join('') || '<tr><td colspan="2" style="text-align:center;color:var(--muted);">No activity yet.</td></tr>';
}

function initSettingsToggle() {
  const cb = document.getElementById('dark-toggle-settings');
  const track = document.getElementById('toggle-track');
  const isDark = localStorage.getItem('mg_dark') === '1';
  cb.checked = isDark;
  track.style.background = isDark ? 'var(--primary)' : '#ccc';
  cb.addEventListener('change', () => {
    document.body.classList.toggle('dark', cb.checked);
    localStorage.setItem('mg_dark', cb.checked ? '1' : '0');
    track.style.background = cb.checked ? 'var(--primary)' : '#ccc';
  });
}

function exportAllData() {
  const data = {
    users: DB.get('users').map(u => ({ ...u, password: '***' })),
    partners: DB.get('partners'),
    deals: DB.get('deals'),
    contracts: DB.get('contracts'),
    communications: DB.get('communications'),
    activities: DB.get('activities'),
    reports: DB.get('reports'),
    exported_at: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `manics_data_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  toast('Data exported!');
}

async function clearData() {
  if (!confirm('⚠️ This will reset ALL data to defaults. Are you sure?')) return;
  if (!confirm('This action cannot be undone. Confirm reset?')) return;
  try {
    await apiFetch('/api/reset', { method: 'POST', body: '{}' });
    toast('Database reset. Redirecting...', 'warning');
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  } catch (error) {
    toast(error.message, 'error');
  }
}
</script>
</body>
</html>
